[project]
name = "final-project-stackfuel"
version = "0.1.0"
description = "Reproducible analysis of GLP-1 reimbursement scenarios and public-health impact in Germany"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.3.2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=21.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
final-project-stackfuel = "final_project_stackfuel:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
    "pytest>=9.1.1",
]
